{{- $team := .Values.team }}
{{- $release := .Values.release }}
{{- range $app := .Values.applications }}
{{- if $app.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ if eq $release "ci-cd" }}{{ $app.name }}{{ else }}{{ $release }}-{{ $app.name }}{{ end }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: {{ $app.destination | default (printf "%s-%s" $team $release) }}
    server: {{ $app.cluster_api | default "https://kubernetes.default.svc" }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  {{- if $app.sources }}
  sources:
  {{- toYaml $app.sources | nindent 4 }}
  {{- else }}
  source:
    repoURL: {{ $app.source }}
    {{- if $app.chart_name }}
    chart: {{ $app.chart_name }}
    {{- else }}
    path: {{ $app.source_path | default "." }}
    {{- end }}
    targetRevision: {{ $app.source_ref | default "main" }}
    {{- if or $app.helm_values $app.values }}
    helm:
      {{- if $app.helm_values }}
      valueFiles:
      {{- toYaml $app.helm_values | nindent 8 }}
      {{- end }}
      {{- if $app.values }}
      values: |
      {{- toYaml $app.values | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}